<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Neon Dodger</title>
<link rel="stylesheet" href="neon-dodger.css">
</head>
<body>
  <div class="hud">
    <div><span>PUNTOS: </span><b id="score">0</b></div>
    <div><span>RÉCORD: </span><b id="best">0</b></div>
    <div><span>NIVEL: </span><b id="level">1</b></div>
  </div>
  <canvas id="game" width="520" height="360"></canvas>
  <button id="restart" class="btn">Jugar de nuevo</button>
  <div class="controls">Movete con <b>← →</b> o <b>A / D</b> · Esquivá los bloques rojos y agarrá los orbes dorados (+50)</div>

  <script src="neon-dodger.js"></script>
</body>
</html>
